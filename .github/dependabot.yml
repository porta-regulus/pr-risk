version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # typescript-eslint 8.72 supports TypeScript below 6.1 only (DEPENDENCIES.md).
      # Remove this rule when a typescript-eslint release supports the newer TypeScript.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # The major of the Node types follows the Node runtime in .nvmrc, not the newest types.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
  - package-ecosystem: terraform
    directory: /infra/gcp
    schedule:
      interval: monthly
