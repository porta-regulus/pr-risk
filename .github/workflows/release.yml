name: Release

# A tag v* builds the bundle, makes the CycloneDX 1.6 SBOM, attests both,
# publishes a GitHub release and deploys the same files to GCP (ADR-0006).

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  build:
    name: Build, SBOM and attestations
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check that the tag names the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$version" ]]; then echo "::error::Tag $TAG is not package.json $version"; exit 1; fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Package the bundle
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' -C dist -cf - . | gzip -n > "pr-risk-${TAG}.tar.gz"
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "pr-risk-${TAG}-files.sha256"
      - name: CycloneDX 1.6 SBOM
        run: npx --no-install cyclonedx-npm --omit dev --spec-version 1.6 --output-format JSON --output-reproducible --output-file "pr-risk-${TAG}.cdx.json"
      - name: SHA-256 values of the release files
        run: sha256sum "pr-risk-${TAG}.tar.gz" "pr-risk-${TAG}.cdx.json" "pr-risk-${TAG}-files.sha256" > SHA256SUMS
      # On a public repository the attestations are signed with the Sigstore public-good
      # instance and logged in Rekor. On a private repository they need GitHub Enterprise Cloud.
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pr-risk-${{ github.ref_name }}.tar.gz
            pr-risk-${{ github.ref_name }}.cdx.json
            pr-risk-${{ github.ref_name }}-files.sha256
            SHA256SUMS
      - id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: pr-risk-${{ github.ref_name }}.tar.gz
          sbom-path: pr-risk-${{ github.ref_name }}.cdx.json
      # Scorecard Signed-Releases reads release assets only, not the attestation API.
      # A .intoto.jsonl asset in each release gives it the score 10.
      - name: Attach the Sigstore bundles as release files
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "pr-risk-${TAG}.intoto.jsonl"
          cp "$SBOM_BUNDLE" "pr-risk-${TAG}.sbom.intoto.jsonl"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          notes="## Verify this release

          1. \`sha256sum -c SHA256SUMS\`
          2. \`gh attestation verify pr-risk-${TAG}.tar.gz --repo ${GITHUB_REPOSITORY}\`
          3. With the attached Sigstore bundle, \`gh attestation verify pr-risk-${TAG}.tar.gz --repo ${GITHUB_REPOSITORY} --bundle pr-risk-${TAG}.intoto.jsonl\`
          4. SBOM, \`gh attestation verify pr-risk-${TAG}.tar.gz --repo ${GITHUB_REPOSITORY} --predicate-type https://cyclonedx.org/bom --bundle pr-risk-${TAG}.sbom.intoto.jsonl\`
          "
          gh release create "$TAG" --verify-tag --title "$TAG" "${prerelease[@]}" \
            --notes "$notes" --generate-notes \
            "pr-risk-${TAG}.tar.gz" "pr-risk-${TAG}.cdx.json" "pr-risk-${TAG}-files.sha256" SHA256SUMS \
            "pr-risk-${TAG}.intoto.jsonl" "pr-risk-${TAG}.sbom.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to GCP
    needs: build
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Upload and invalidate the CDN
        env:
          SITE_BUCKET: ${{ vars.GCP_SITE_BUCKET }}
          URL_MAP: ${{ vars.GCP_URL_MAP }}
        run: scripts/deploy-gcs.sh dist "gs://${SITE_BUCKET}" "${URL_MAP}"
      - name: Check that the live files equal the attested files
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BUCKET: ${{ vars.GCP_SITE_BUCKET }}
        run: node scripts/verify-deploy.mjs dist "${SITE_URL}"
      - name: Check the live headers
        env:
          BASE_URL: ${{ vars.SITE_URL }}
        run: npx --no-install playwright test e2e/headers.spec.ts
