name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  visibility:
    name: Repository visibility
    # A schedule event has no webhook payload, so github.event.repository is empty there.
    # Ask the API. An empty or failed answer counts as private.
    runs-on: ubuntu-24.04
    outputs:
      private: ${{ steps.repo.outputs.private }}
    steps:
      - id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          echo "private=${private}" >> "$GITHUB_OUTPUT"

  analysis:
    name: Scorecard analysis
    # On a private repository the action does not publish, and the JSON result is the
    # workflow artifact. Code scanning on a private repository needs a Code Security
    # licence, so the SARIF upload runs only while the repository is public.
    needs: visibility
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      # CI-Tests reads the commit statuses. A private repository gives 403 without this.
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: ${{ needs.visibility.outputs.private == 'false' && 'scorecard.sarif' || 'scorecard.json' }}
          results_format: ${{ needs.visibility.outputs.private == 'false' && 'sarif' || 'json' }}
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: ${{ needs.visibility.outputs.private == 'false' && 'scorecard.sarif' || 'scorecard.json' }}
          retention-days: 90
      - if: needs.visibility.outputs.private == 'false'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
