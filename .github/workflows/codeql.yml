name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions: read-all

jobs:
  visibility:
    name: Repository visibility
    # A schedule event has no webhook payload, so github.event.repository is empty there.
    # Ask the API. An empty or failed answer counts as private.
    runs-on: ubuntu-24.04
    outputs:
      private: ${{ steps.repo.outputs.private }}
    steps:
      - id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          echo "private=${private}" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze ${{ matrix.language }}
    # Code scanning on a private repository needs a Code Security licence (Team plan).
    # Run only while the repository is public.
    needs: visibility
    if: needs.visibility.outputs.private == 'false'
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
